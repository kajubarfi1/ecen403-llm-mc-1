<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DDR3 Pipeline Validation Coverage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  .maroon-serif { font-family: Georgia, "Times New Roman", serif; }
  .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</helmet>

<div style="width: 1600px; height: 1000px; box-sizing: border-box; background: #FBF8F6; padding: 40px 48px; display: flex; flex-direction: column; gap: 22px;">

  <!-- Top: microarchitecture agent -->
  <div style="display:flex; align-items:center; gap:16px; background:#500000; border-radius:14px; padding:16px 28px; box-shadow:0 2px 6px rgba(80,0,0,0.18);">
    <div style="width:10px;height:10px;border-radius:50%;background:#5FD68A;flex-shrink:0;"></div>
    <div class="sans" style="color:#FBF8F6; font-size:20px; font-weight:700; letter-spacing:0.2px;">Generated Microarchitecture Agent</div>
    <div class="sans" style="margin-left:auto; color:#E7C9C9; font-size:13px;">English / preset &rarr; JEDEC-consistent spec</div>
  </div>

  <!-- Legend -->
  <div style="display:flex; gap:22px; align-items:center; padding:0 4px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:14px;height:14px;border-radius:4px;background:#DCF3E3;border:1.5px solid #3F9E5E;"></div>
      <span class="sans" style="font-size:13px;color:#3A3A38;">Built &amp; verified</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:14px;height:14px;border-radius:4px;background:#F1EFEC;border:1.5px dashed #A8A29C;"></div>
      <span class="sans" style="font-size:13px;color:#6B6862;">Planned</span>
    </div>
  </div>

  <!-- Phase columns -->
  <div style="display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:20px; flex-grow:1;">
    <sc-for list="{{phases}}" as="phase" hint-placeholder-count="4">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="maroon-serif" style="background:#7A1F1F; color:#FBF8F6; font-weight:700; font-size:18px; text-align:center; border-radius:10px; padding:10px 0;">{{phase.name}}</div>
        <sc-for list="{{phase.rows}}" as="row" hint-placeholder-count="5">
          <div style="display:flex; align-items:center; gap:10px; background:{{row.bg}}; border:{{row.border}}; border-radius:9px; padding:11px 14px;">
            <sc-if value="{{row.built}}" hint-placeholder-val="{{true}}">
              <svg width="16" height="16" viewBox="0 0 16 16" style="flex-shrink:0;">
                <circle cx="8" cy="8" r="8" fill="#3F9E5E"/>
                <path d="M4.5 8.3L6.8 10.6L11.5 5.6" stroke="#FBF8F6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </sc-if>
            <sc-if value="{{row.planned}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 16 16" style="flex-shrink:0;">
                <circle cx="8" cy="8" r="6.5" fill="none" stroke="#A8A29C" stroke-width="1.6" stroke-dasharray="2.6 2.4"/>
              </svg>
            </sc-if>
            <span class="sans" style="font-size:13.5px; font-weight:600; color:{{row.textColor}}; line-height:1.25;">{{row.label}}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- Full-system row -->
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
    <div style="display:flex; align-items:center; gap:12px; background:#DCF3E3; border:1.5px solid #3F9E5E; border-radius:12px; padding:16px 24px;">
      <svg width="18" height="18" viewBox="0 0 16 16" style="flex-shrink:0;">
        <circle cx="8" cy="8" r="8" fill="#3F9E5E"/>
        <path d="M4.5 8.3L6.8 10.6L11.5 5.6" stroke="#FBF8F6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="sans">
        <div style="font-size:15px; font-weight:700; color:#1E4A2E;">Full-System Lint</div>
        <div style="font-size:12.5px; color:#3A6B47;">Combined Verilator lint across all 11 assembled modules</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:12px; background:#F1EFEC; border:1.5px dashed #A8A29C; border-radius:12px; padding:16px 24px;">
      <svg width="18" height="18" viewBox="0 0 16 16" style="flex-shrink:0;">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="#A8A29C" stroke-width="1.6" stroke-dasharray="2.6 2.4"/>
      </svg>
      <div class="sans">
        <div style="font-size:15px; font-weight:700; color:#5A564F;">Full-System Sim (vs. Micron Spec)</div>
        <div style="font-size:12.5px; color:#7A766E;">Validation Subsystem's independent reference model</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const built = (label) => ({
      label, built: true, planned: false,
      bg: "#DCF3E3", border: "1.5px solid #3F9E5E", textColor: "#1E4A2E"
    });
    const planned = (label) => ({
      label, built: false, planned: true,
      bg: "#F1EFEC", border: "1.5px dashed #A8A29C", textColor: "#6B6862"
    });

    const phases = [
      {
        name: "Phase 1",
        rows: [
          built("Generated RTL"),
          built("Generated TBs"),
          built("RTL Validation Agent"),
          built("TB Validation Agent"),
          built("Lint"),
        ],
      },
      {
        name: "Phase 2",
        rows: [
          built("Generated RTL"),
          built("Generated TBs"),
          built("RTL Validation Agent"),
          planned("TB Validation Agent"),
          built("Lint"),
        ],
      },
      {
        name: "Phase 3",
        rows: [
          built("Generated RTL"),
          built("Generated TBs"),
          planned("RTL Validation Agent"),
          planned("TB Validation Agent"),
          built("Lint"),
        ],
      },
      {
        name: "Phase 4",
        rows: [
          built("Generated RTL"),
          built("Generated TBs"),
          planned("RTL Validation Agent"),
          planned("TB Validation Agent"),
          built("Lint"),
        ],
      },
    ];

    return { phases };
  }
}
</script>
</body>
</html>
