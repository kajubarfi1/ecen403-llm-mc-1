<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
"use strict";
// filled in by the server when this page may drive a terminal
const RAW_TOKEN = "__FLOW_GUI_TOKEN__";
const TOKEN = RAW_TOKEN.includes("FLOW_GUI_TOKEN") ? "" : RAW_TOKEN;
// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function dur(s) {
  if (s == null || !isFinite(s)) return "";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h) return `${h}h ${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m ${String(sec).padStart(2, "0")}s`;
  return `${sec}s`;
}
const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- state
let data = null, selected = null, follow = true, serverSkew = 0, failCount = 0;
let vdata = null, selPath = null, openFindings = new Set();
const params = new URLSearchParams(location.search);
if (params.get("run")) { selected = params.get("run"); follow = false; }

let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const q = selected && !follow ? `?run=${encodeURIComponent(selected)}` : "";
    const [r, rv] = await Promise.all([
      fetch(`/api/status${q}`, { cache: "no-store" }),
      fetch(`/api/validation${q}`, { cache: "no-store" }).catch(() => null)]);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    serverSkew = j.now - Date.now() / 1000;
    data = j; failCount = 0;
    try { const jv = rv ? await rv.json() : null; if (jv && !jv.error) vdata = jv; } catch (e) {}
    render();
  } catch (e) {
    failCount++;
    if (failCount > 2) { $("status").className = "pill"; $("status-text").textContent = "monitor offline"; }
  }
  pollTimer = setTimeout(poll, 2000);
}
const nowS = () => Date.now() / 1000 + serverSkew;

// ---------------------------------------------------------------- page
const STAGE_ICON = { pass: "✓", fail: "✕", halt: "!", skip: "–", loop: "↺", active: "", pending: "" };
function render() {
  const run = data.run;
  // run picker
  const sel = $("run-select");
  const opts = [`<option value="__follow">Follow newest run</option>`].concat(
    data.runs.map((r) => `<option value="${esc(r.id)}">${esc(r.id)} · ${esc(r.status || "?")}</option>`));
  const want = follow ? "__follow" : selected;
  if (sel.dataset.sig !== opts.join("")) { sel.innerHTML = opts.join(""); sel.dataset.sig = opts.join(""); }
  sel.value = want;

  if (!run) {
    $("status-text").textContent = "no runs yet";
    $("strip").innerHTML = `<div class="empty" style="grid-column:1/-1">Start one with <code>python3 flow.py</code></div>`;
    return;
  }
  const st = run.status;
  $("status").className = "pill " + st;
  $("status-text").textContent = st === "running" ? "running" : st;
  const end = st === "running" ? nowS() : (run.updated || nowS());
  $("elapsed").textContent = `${run.id} · ${dur(end - run.created)}`;
  const showBackendHero = heroIsBackend();
  document.title = st !== "running" ? `LLM MC Flow Monitor`
    : showBackendHero ? `${Math.floor(data.backend.progress * 100)}% · backend · LLM MC`
    : `frontend · LLM MC`;

  // stage strip
  $("strip").innerHTML = data.stages.map((s, i) => {
    const t = s.state === "active" && s.started ? dur(nowS() - s.started)
      : s.started && s.ended ? dur(s.ended - s.started) : (s.state === "pending" ? "" : s.state);
    const n = STAGE_ICON[s.state] || "";
    const rounds = s.key === "backend" && run.rounds.backend > 1 ? ` · round ${run.rounds.backend}` : "";
    return `<div class="stage ${s.state} ${s.key}" title="${esc(s.detail || "")}">
      <div class="node">${n || (s.state === "active" ? "●" : i + 1)}</div>
      <div class="lab">${esc(s.label)}</div><div class="sub">${esc(t + rounds)}</div></div>`;
  }).join("");

  if (showBackendHero) renderBackend(); else renderFrontendHero();
  renderFrontend();
  renderValidation();
  renderLog();
  term.update(data.terminal || { available: false, reason: "" });
  chip.update(data);
}

// ---------------------------------------------------------- hero panel
// The big card (% / bar / tiles / steps) shows whichever subsystem is
// actually moving right now: Frontend (generation, its own fix-loop, and
// the system validation suite) until the backend starts, then Backend --
// and back to Frontend again if the backend sends work back (loop stages
// alias to rtl_generation in the stage strip, same signal used here).
function heroIsBackend() {
  const cur = data.current;
  if (cur) return cur.key === "backend";
  const st = (data.stages || []).find((s) => s.key === "backend");
  return !!(st && st.state !== "pending");
}

const STEP_STATE = { pending: "pending", active: "active", pass: "done", fail: "fail" };

function frontendHeroSteps() {
  const fe = data.frontend, val = data.validation, af = fe.active_fix;
  const steps = fe.phases.map((p) => {
    const mods = Object.entries(p.modules);
    const passed = mods.filter(([, s]) => s === "pass").length;
    const fixing = af && af.phase === p.n;
    let state = STEP_STATE[p.result] || "pending";
    let detail = mods.map(([m, s]) => `${m}: ${s}`).join(" · ");
    if (fixing) {
      state = "active";
      detail = `fixing ${af.module} — attempt ${af.attempt}/${af.max_attempts}` +
        (af.confidence ? ` (${af.confidence} confidence)` : "");
    }
    return { key: `phase${p.n}`, label: `Phase ${p.n}`, weight: Math.max(1, mods.length), state,
      frac: fixing ? 0.5 : mods.length ? passed / mods.length : 0, detail,
      started: p.started, ended: p.ended };
  });
  const vTotal = val.total || (val.paths || []).length || 20;
  const vDone = (val.paths || []).length;
  const vState = STEP_STATE[val.result] || "pending";
  steps.push({
    key: "validate", label: "System validation", weight: 6, state: vState,
    frac: vTotal ? vDone / vTotal : 0,
    detail: val.summary ? `${val.summary.pass} pass, ${val.summary.fail} fail, ${val.summary.error} error`
      : vDone ? `${vDone}/${vTotal} paths run` : "",
    started: val.started, ended: null,
  });
  return steps;
}

function renderFrontendHero() {
  const fe = data.frontend, val = data.validation, run = data.run;
  $("hero-title").textContent = "Frontend · RTL generation & validation";
  const steps = frontendHeroSteps();
  const totW = steps.reduce((a, s) => a + s.weight, 0) || 1;
  const doneW = steps.reduce((a, s) => a + s.weight * (s.state === "pending" ? 0 : s.frac), 0);
  const allDone = steps.every((s) => s.state === "done");
  const anyActive = steps.some((s) => s.state === "active");
  const anyFail = steps.some((s) => s.state === "fail");
  const pct = allDone ? 100 : Math.min(99.9, (doneW / totW) * 100);

  $("bk-pct").innerHTML = `${pct < 10 && pct > 0 ? pct.toFixed(1) : Math.floor(pct)}<small>%</small>`;
  const bar = $("bk-bar");
  bar.className = "bar " + (anyActive ? "active" : allDone ? "pass" : anyFail ? "fail" : "");
  bar.querySelector(".fill").style.width = pct.toFixed(2) + "%";
  let acc = 0;
  $("bk-ticks").innerHTML = steps.slice(0, -1).map((s) => { acc += s.weight; return `<span style="left:${acc / totW * 100}%"></span>`; }).join("");

  const firstStart = steps.map((s) => s.started).filter(Boolean).sort((a, b) => a - b)[0];
  $("bk-eta").innerHTML = anyActive && firstStart ? `<b>${dur(nowS() - firstStart)}</b>elapsed`
    : firstStart ? `<b>—</b>in progress` : `<b>—</b>not started`;

  const cur = steps.find((s) => s.state === "active");
  $("bk-now").innerHTML = cur ? `${esc(cur.label)}<span class="detail">${esc(cur.detail || "")}</span>`
    : allDone ? "Frontend generation + validation complete"
    : anyFail ? "A module or validation path failed"
    : "Waiting to start";

  $("bk-meta").textContent = fe.round ? `round ${fe.round}` : "";

  let banner = "";
  if (run.status === "halted" && run.halt) {
    banner = `<div class="banner halt"><b>Halted at ${esc(run.halt.stage)}</b>: ${esc((run.halt.why || "").slice(0, 280))}<br>
      Resume with <code>python3 flow.py --resume ${esc(run.dir)}</code></div>`;
  } else if (fe.active_fix) {
    const af = fe.active_fix, trig = trigLabel(af.trigger);
    banner = `<div class="banner loop"><b>⚡ Fixing ${esc(af.module)}</b> — attempt ${af.attempt}/${af.max_attempts}` +
      (trig ? ` · triggered by ${esc(trig)}` : "") + `</div>`;
  } else if (val.result === "fail" && (val.failed_modules || []).length) {
    banner = `<div class="banner loop"><b>↩ Sent back to Frontend</b> — ${esc(val.failed_modules.join(", "))} (round ${val.round})</div>`;
  } else if (allDone) {
    banner = `<div class="banner pass">All phases generated and all system paths passed.</div>`;
  }
  $("banner").innerHTML = banner;

  const unresolved = (fe.fixloop || []).filter((f) => f.outcome === "unresolved" || f.outcome === "error").length;
  const modPass = fe.phases.reduce((a, p) => a + Object.values(p.modules).filter((s) => s === "pass").length, 0);
  const modTotal = fe.phases.reduce((a, p) => a + Object.keys(p.modules).length, 0);
  const tiles = [
    ["Modules", `${modPass}/${modTotal}`, modPass === modTotal ? "good" : ""],
    ["Validation round", fe.round || "—", ""],
    ["Paths", val.summary ? `${val.summary.pass}/${val.total || (val.paths || []).length}` : "—",
      val.summary && val.summary.fail ? "bad" : (val.summary ? "good" : "")],
    ["Fix attempts", (fe.fixloop || []).length ? `${fe.fixloop.length}${unresolved ? ` (${unresolved} stuck)` : ""}` : "—",
      unresolved ? "bad" : ""],
  ];
  $("tiles").innerHTML = tiles.map(([k, v, c]) => `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${esc(v)}</div></div>`).join("");

  $("steps").innerHTML = steps.map((s) => {
    const ic = { done: "✓", fail: "✕", halt: "!", skip: "–" }[s.state] || "";
    let tm = "";
    if (s.state === "active") tm = `${Math.round(s.frac * 100)}%`;
    else if (s.started && s.ended && s.state !== "pending") tm = dur(s.ended - s.started);
    return `<li class="step ${s.state}">
      <span class="ic">${ic}</span><span class="nm" title="${esc(s.detail || "")}">${esc(s.label)}</span>
      <span class="mini"><b style="width:${(s.state === "pending" ? 0 : s.frac * 100).toFixed(1)}%"></b></span>
      <span class="tm">${tm}</span></li>`;
  }).join("");

  $("notes").innerHTML = (fe.fixloop || []).slice(-4).reverse().map((f) =>
    `<div>${f.ended ? clock(f.ended) + " " : ""}${esc(f.module)} attempt ${f.attempt}/${f.max_attempts}: ${esc(f.outcome || "in progress")}</div>`
  ).join("");
}

function renderBackend() {
  const bk = data.backend, run = data.run;
  $("hero-title").textContent = "Backend · RTL → GDSII";
  const pct = bk.progress * 100;
  $("bk-pct").innerHTML = `${pct < 10 && pct > 0 ? pct.toFixed(1) : Math.floor(pct)}<small>%</small>`;
  const bar = $("bk-bar");
  bar.className = "bar " + (bk.active ? "active" : bk.result === "pass" ? "pass" : bk.result === "fail" ? "fail" : "");
  bar.querySelector(".fill").style.width = pct.toFixed(2) + "%";
  // tick marks at step boundaries
  const tot = bk.steps.reduce((a, s) => a + s.weight, 0);
  let acc = 0;
  $("bk-ticks").innerHTML = bk.steps.slice(0, -1).map((s) => { acc += s.weight; return `<span style="left:${acc / tot * 100}%"></span>`; }).join("");

  // ETA
  let eta = "";
  if (bk.active && bk.eta_s != null) eta = `<b>≈ ${dur(bk.eta_s)} left</b>done around ${clock(nowS() + bk.eta_s)}`;
  else if (bk.active) eta = `<b>${dur(nowS() - bk.started)}</b>elapsed`;
  else if (bk.started && bk.elapsed) eta = `<b>${dur(bk.elapsed)}</b>backend time`;
  else eta = `<b>—</b>not started`;
  $("bk-eta").innerHTML = eta;

  const cur = bk.steps.find((s) => s.state === "active");
  let now = "";
  if (cur) now = `${esc(cur.label)}<span class="detail">${esc(cur.detail || "")}</span>`;
  else if (bk.result === "pass") now = "Layout signed off: GDSII ready";
  else if (bk.result === "fail") now = `Backend failed${bk.report && bk.report.failed_stage ? " at " + esc(bk.report.failed_stage) : ""}`;
  else if (!bk.started) {
    const c = data.current;
    now = c ? `Waiting: the flow is in <b>${esc(labelOf(c.key))}</b>` : "Backend has not started";
  }
  $("bk-now").innerHTML = now;
  const meta = [];
  if (bk.orfs.design) meta.push(bk.orfs.design);
  meta.push(data.platform);
  if (bk.orfs.pass > 1) meta.push(`ORFS pass ${bk.orfs.pass}`);
  if (run.rounds.backend) meta.push(`round ${run.rounds.backend}`);
  $("bk-meta").textContent = meta.join(" · ");

  // banner
  let banner = "";
  if (run.status === "halted" && run.halt) {
    banner = `<div class="banner halt"><b>Halted at ${esc(run.halt.stage)}</b>: ${esc((run.halt.why || "").slice(0, 280))}<br>
      Resume with <code>python3 flow.py --resume ${esc(run.dir)}</code></div>`;
  } else if (bk.result === "fail" && bk.result_detail) {
    banner = `<div class="banner fail">${esc(bk.result_detail)}</div>`;
  } else if (bk.active && bk.orfs.estimated && !data.orfs_dir) {
    banner = `<div class="banner info">ORFS step logs not found (set <code>ORFS_DIR</code> or pass <code>--orfs-dir</code>), so step progress is estimated from elapsed time.</div>`;
  } else if (run.status === "running" && run.quiet_s > 1800) {
    banner = `<div class="banner halt">Nothing written for ${dur(run.quiet_s)}. Check that flow.py is still running.</div>`;
  } else if (bk.result === "pass") {
    banner = `<div class="banner pass">Backend PASS: placed, routed and signed off.</div>`;
  }
  $("banner").innerHTML = banner;

  // tiles
  const r = bk.report || {};
  const tiles = [
    ["Cells", bk.orfs.cells != null ? bk.orfs.cells.toLocaleString() : "—", ""],
    ["Route violations", bk.orfs.violations != null ? bk.orfs.violations.toLocaleString() : "—",
      bk.orfs.violations === 0 ? "good" : ""],
    ["DRC / LVS", r.drc_violations != null || r.lvs_status ? `${r.drc_violations ?? "—"} / ${r.lvs_status ?? "—"}` : "—",
      r.drc_violations === 0 && r.lvs_status === "PASS" ? "good" : (r.lvs_status && r.lvs_status !== "PASS" ? "bad" : "")],
    ["WNS", r.sta_wns_ns != null ? `${(+r.sta_wns_ns).toFixed(3)} ns` : "—",
      r.sta_wns_ns != null ? (r.sta_wns_ns >= 0 ? "good" : "bad") : ""],
  ];
  $("tiles").innerHTML = tiles.map(([k, v, c]) => `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${esc(v)}</div></div>`).join("");

  // steps
  const ORFS = new Set(["synth", "floorplan", "place", "cts", "grt", "route", "finish"]);
  $("steps").innerHTML = bk.steps.map((s) => {
    const ic = { done: "✓", fail: "✕", halt: "!", skip: "–" }[s.state] || "";
    let tm = "";
    if (s.state === "active") tm = `${Math.round(s.frac * 100)}%`;
    else if (s.started && s.ended && s.state !== "pending") tm = dur(s.ended - s.started);
    else if (s.state === "skip") tm = "skipped";
    return `<li class="step ${s.state} ${ORFS.has(s.key) ? "orfs" : ""}">
      <span class="ic">${ic}</span><span class="nm" title="${esc(s.detail || "")}">${esc(s.label)}</span>
      <span class="mini"><b style="width:${(s.state === "pending" ? 0 : s.frac * 100).toFixed(1)}%"></b></span>
      <span class="tm">${tm}</span></li>`;
  }).join("");
  $("notes").innerHTML = (bk.notes || []).slice(-4).map((n) => `<div>${esc(clock(n.t))} ${esc(n.text)}</div>`).join("");
}

const FIX_ICON = { fixed: "✓", unresolved: "✕", error: "⚠", retry: "↺" };
function trigLabel(trig) {
  if (!trig) return "";
  return trig.kind === "validation" ? `validation round ${trig.round} FAIL` : "own sim gate";
}
function renderFrontend() {
  const fe = data.frontend;
  if (!fe) return;
  $("fe-meta").textContent = fe.round ? `round ${fe.round}` : "";

  $("fe-phases").innerHTML = fe.phases.map((p) => {
    const mods = Object.entries(p.modules).map(([m, s]) =>
      `<span class="mod-chip ${s}" title="${esc(m)}: ${esc(s)}"><span class="dot"></span>${esc(m)}</span>`).join("");
    const pnCls = p.result === "active" ? "active" : p.result === "fail" ? "fail" : "";
    return `<div class="phase-row"><span class="pn ${pnCls}">Phase ${p.n}</span>${mods}</div>`;
  }).join("");

  const af = fe.active_fix;
  let banner = "";
  if (af) {
    const trig = trigLabel(af.trigger);
    banner = `<div class="banner loop"><b>⚡ Fixing ${esc(af.module)}</b> — attempt ${af.attempt}/${af.max_attempts}` +
      (af.confidence ? ` <span style="opacity:.75">(${esc(af.confidence)} confidence diagnosis)</span>` : "") +
      (trig ? `<br><span style="opacity:.8">triggered by ${esc(trig)}</span>` : "") + `</div>`;
  }
  $("fe-banner").innerHTML = banner;

  const hist = (fe.fixloop || []).slice(-8).reverse();
  $("fe-fixhist").innerHTML = hist.length ? hist.map((f) => {
    const cls = f.outcome || "active";
    const ic = f.outcome ? (FIX_ICON[f.outcome] || "?") : "…";
    const trig = trigLabel(f.trigger);
    return `<div class="fix-ev ${cls}"><span class="ic">${ic}</span>
      <span class="mod">${esc(f.module)}</span><span>attempt ${f.attempt}/${f.max_attempts}</span>
      <span class="trig">${esc(trig)}</span></div>`;
  }).join("") : `<div class="empty" style="padding:16px 0">No fix attempts this run.</div>`;
}

function renderValidation() {
  const v = data.validation;
  if (!v) return;
  // Reports on disk (vdata) carry every stage checker and the lines it failed
  // on; the live log (v) only knows pass/fail per path while a round runs.
  // A run's own reports win; the repository's checked-in drop is shown, and
  // said to be, when the run has none yet.
  const vd = vdata && (vdata.source === "run" || !data.run) ? vdata : null;
  const repoFallback = vdata && vdata.source === "repo" && data.run;
  const live = v.result === "active";
  const paths = vd && !live ? vd.paths.map((p) => ({ name: p.name, status: p.verdict === "pass" ? "pass" : p.verdict === "fail" ? "fail" : "other" }))
    : (v.paths || []);
  const s = vd && !live ? vd.summary : (v.summary || {});
  $("val-meta").textContent = [v.round ? `round ${v.round}` : "", vd && vd.drop.drop_id ? `drop ${vd.drop.drop_id}` : ""].filter(Boolean).join(" · ");
  const fm = vd && vd.formal;
  const fProven = fm ? (fm.counts.proven || 0) + (fm.counts.bounded_proven || 0) : null;
  const fTotal = fm ? fm.results.filter((r) => r.status !== "covered").length : null;
  const tiles = vd && !live ? [
    ["Pass", s.pass ?? "—", s.pass ? "good" : ""],
    ["Fail", s.fail ?? "—", s.fail ? "bad" : ""],
    ["Findings", s.findings_open ?? "—", s.findings_open ? "bad" : s.findings_open === 0 ? "good" : ""],
    ["Formal", fm ? `${fProven}/${fTotal}` : "—", fm ? (fm.counts.cex ? "bad" : "") : ""],
  ] : [
    ["Pass", s.pass ?? "—", s.pass ? "good" : ""],
    ["Fail", s.fail ?? "—", s.fail ? "bad" : ""],
    ["Error", s.error ?? "—", s.error ? "bad" : ""],
    ["Total", v.total ?? (v.paths || []).length ?? "—", ""],
  ];
  $("val-tiles").innerHTML = tiles.map(([k, val, c]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${esc(val)}</div></div>`).join("");

  const note = $("val-note");
  if (repoFallback && !live) {
    note.hidden = false;
    note.textContent = `Showing the repository's checked-in drop (${vdata.drop.drop_id || "?"}): this run has no validation reports yet.`;
  } else if (vd && ((vd.coverage && vd.coverage.matches_spec) || (vd.random && vd.random.runs.length))) {
    const c = (vd.coverage && vd.coverage.matches_spec) ? vd.coverage : {};
    const r = vd.random || { runs: [] };
    const parts = [
      r.runs.length ? `random: ${r.pass}/${r.runs.length} seeds pass${r.fail ? ` (${r.fail} fail)` : ""}` : "",
      c.code_pct != null ? `code coverage ${c.code_pct}% measured${c.adjusted_pct != null ? ` · ${c.adjusted_pct}% adjusted (${c.excluded_bits} bits under ${c.exclusions_approved} approved exclusions)` : ""}` : "",
      c.covered != null ? `${c.covered}/${c.vplan_items} vplan items covered${c.unreachable ? ` (${c.unreachable} unreachable by spec)` : ""}` : ""].filter(Boolean);
    note.hidden = !parts.length;
    note.textContent = parts.join(" · ");
  } else note.hidden = true;

  if (selPath && !paths.some((p) => p.name === selPath)) selPath = null;
  $("val-paths").innerHTML = paths.length
    ? paths.map((p) => `<div class="path-chip ${p.status} ${p.name === selPath ? "sel" : ""}" data-path="${esc(p.name)}" title="${esc(p.name)}">
        <span class="dot"></span><span class="nm">${esc(p.name.replace(/^path_\d+_/, ""))}</span></div>`).join("")
    : `<div class="empty" style="padding:16px 0">${live ? "Running…" : "No validation run yet."}</div>`;
  $("val-paths").querySelectorAll(".path-chip").forEach((el) => el.addEventListener("click", () => {
    selPath = selPath === el.dataset.path ? null : el.dataset.path; renderValidation();
  }));

  let banner = "";
  if (v.result === "fail" && (v.failed_modules || []).length) {
    const mods = v.failed_modules;
    banner = `<div class="banner loop"><b>↩ Sent back to Frontend</b> — ${esc(mods.join(", "))} ` +
      `${mods.length > 1 ? "need" : "needs"} regeneration (round ${v.round})</div>`;
  } else if (v.result === "pass") {
    banner = `<div class="banner pass">All system paths passed.</div>`;
  }
  $("val-banner").innerHTML = banner;

  renderPathDetail(vd && !live ? vd : null);
  renderFindings(vd && !live ? vd : null);
  renderFormal(vd && !live ? vd : null);
}

const vcls = (verdict) => verdict === "pass" ? "v-pass" : verdict === "fail" ? "v-fail" : "v-other";

function renderPathDetail(vd) {
  const el = $("val-detail");
  const p = vd && selPath ? vd.paths.find((x) => x.name === selPath) : null;
  if (!p) { el.innerHTML = ""; return; }
  const hd = `<div class="hd"><span class="nm">${esc(p.name)}</span>
      <span class="${vcls(p.verdict)}">${esc((p.verdict || "?").toUpperCase())}</span>
      <span class="meta">${esc(p.strategy || "")}${p.autonomous ? " · autonomous" : p.stimulus ? " · " + esc(p.stimulus) : ""}${p.window_cycles ? " · " + p.window_cycles + " cycles" : ""}</span>
      <span class="meta">${esc((p.blocks || []).join(", "))}</span><span class="spacer"></span>
      ${p.has_log ? `<button class="sm" data-what="log">Sim log</button>` : ""}
      ${p.has_trace ? `<button class="sm" data-what="trace">Trace</button>` : ""}
      <button class="sm" data-what="report">Report</button></div>`;
  const rows = p.stages.map((st) => `<tr>
      <td class="st">${esc(st.stage)}</td><td class="st ${vcls(st.verdict)}">${esc(st.verdict || "")}</td>
      <td class="st">${esc(st.kind || "")}</td>
      <td class="sum">${esc(st.summary || "")}${st.detail.length ? `<div class="det">${esc(st.detail.join("\n"))}${st.detail_total > st.detail.length ? `\n… ${st.detail_total - st.detail.length} more (see Report)` : ""}</div>` : ""}</td></tr>`).join("");
  el.innerHTML = `<div class="val-detail">${hd}<table class="stage-tbl"><thead><tr><th>Stage</th><th>Verdict</th><th>Check</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  el.querySelectorAll("button.sm").forEach((b) => b.addEventListener("click", () => openPathArtifact(p.name, b.dataset.what)));
}

async function openPathArtifact(path, what) {
  const q = selected && !follow ? `&run=${encodeURIComponent(selected)}` : "";
  const out = $("testlog");
  out.innerHTML = `<span>loading ${esc(what)} for ${esc(path)}…</span>`;
  window.showTab && window.showTab("test", true);
  try {
    const r = await fetch(`/api/validation/path?path=${encodeURIComponent(path)}&what=${what}${q}`, { cache: "no-store" });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    if (what === "report") {
      out.innerHTML = `<span class="cmd">${esc(path)}_report.json</span>\n` + esc(JSON.stringify(j.json, null, 2));
    } else {
      const lines = (j.text || "").split("\n").map((line) => {
        let cls = "";
        if (/ASRTST|DRIVER_STALL|MISMATCH|CONSERVE|HOSTMEM|ADDRORDER|\bFAIL\b|\*E,/.test(line)) cls = "bad";
        else if (/\bPASS\b|status=pass/.test(line)) cls = "ok";
        else if (/\*W,|WARN/.test(line)) cls = "warn";
        else if (line.startsWith("TXN ")) cls = "bk";
        return `<span class="${cls}">${esc(line)}</span>`;
      });
      out.innerHTML = `<span class="cmd">${esc(j.file)}${j.truncated ? ` (last ${Math.round(j.text.length / 1024)} KB of ${Math.round(j.size / 1024)} KB)` : ""}</span>\n` + lines.join("\n");
    }
    out.scrollTop = what === "report" ? 0 : out.scrollHeight;
  } catch (e) { out.innerHTML = `<span class="bad">${esc(String(e))}</span>`; }
}

function renderFindings(vd) {
  const head = $("val-findings-head"), list = $("val-findings");
  if (!vd) { head.hidden = true; list.innerHTML = ""; return; }
  head.hidden = false;
  const rounds = vd.rounds || [];
  $("val-rounds").textContent = rounds.length
    ? rounds.map((r) => `round ${r.round}: ${r.status || "?"}${r.findings ? `, ${r.findings} finding${r.findings > 1 ? "s" : ""}` : ""}${r.failed_modules.length ? ` (${r.failed_modules.join(", ")})` : ""}`).join(" → ")
    : (vd.drop.generated_utc ? `package ${vd.drop.generated_utc.slice(0, 16).replace("T", " ")}` : "");
  if (!vd.findings.length) {
    list.innerHTML = `<div class="val-note" style="margin:0 0 6px">No open findings${vd.resolved.length ? ` · ${vd.resolved.length} resolved since the previous drop` : ""}.</div>`;
    return;
  }
  list.innerHTML = vd.findings.map((f) => `<div class="finding ${esc(f.severity || "")} ${f.status === "awaiting_formal" ? "awaiting_formal" : ""} ${openFindings.has(f.id) ? "open" : ""}" data-id="${esc(f.id)}">
      <div class="row1"><span class="sev ${esc(f.severity || "")}">${esc(f.severity || "?")}</span>
        <span class="own">${esc(f.owner || "")}</span><span class="chk">${esc(f.check_id || "")}</span>
        <span class="meta2">${esc(f.status || "")}${f.occurrences ? ` · ×${f.occurrences}` : ""}${f.paths.length ? ` · ${f.paths.map((p) => p.replace(/^path_\d+_/, "")).join(", ")}` : ""}</span></div>
      <div class="body">${esc([f.requirement ? "requirement: " + f.requirement : "", f.expected && f.expected !== f.requirement ? "expected:    " + f.expected : "", f.actual ? "actual:      " + f.actual : "",
        f.detector ? "detector:    " + f.detector : "", f.taxonomy ? "taxonomy:    " + f.taxonomy : "", f.spec_ref ? "spec:        " + f.spec_ref : "",
        f.candidates.length > 1 ? "candidates:  " + f.candidates.join(", ") : ""].filter(Boolean).join("\n"))}</div></div>`).join("");
  list.querySelectorAll(".finding").forEach((el) => el.addEventListener("click", () => {
    const id = el.dataset.id; openFindings.has(id) ? openFindings.delete(id) : openFindings.add(id); el.classList.toggle("open");
  }));
}

function renderFormal(vd) {
  const head = $("val-formal-head"), el = $("val-formal");
  const fm = vd && vd.formal;
  if (!fm) { head.hidden = true; el.innerHTML = ""; return; }
  head.hidden = false;
  const c = fm.counts;
  $("val-formal-meta").textContent = `${fm.path} · ${fm.time_limit || ""} · ${Object.entries(c).map(([k, n]) => `${n} ${k.replace(/_/g, " ")}`).join(", ")}${fm.abstractions.length ? " · abstracted" : ""}`;
  el.innerHTML = fm.results.filter((r) => r.status !== "covered").map((r) =>
    `<span class="fchip ${esc(r.status || "")}" title="${esc(`${r.status} · bound ${r.bound} · ${r.engine || ""} ${r.time || ""}`)}">${esc(r.name.replace(/^a_/, ""))}${r.status === "proven" ? "" : " " + esc(String(r.bound || ""))}</span>`).join("");
}

const labelOf = (k) => (data.stages.find((s) => s.key === k) || { label: k }).label;

function renderLog() {
  const el = $("log");
  const lines = data.log_tail.slice(-160).map(({ t, line }) => {
    let cls = "";
    if (line.startsWith("$ ")) cls = "cmd";
    else if (/\b(FAIL|HALT|HALTED|ERROR)\b/.test(line)) cls = "bad";
    else if (/\b(PASS|exit_code=0)\b/.test(line)) cls = "ok";
    else if (/\b(WARN|warning|ROUTED)\b/i.test(line)) cls = "warn";
    else if (/^\s*\[(intake|packager|runner|reporter|validator|tuner|fmax_tuner|power_tuner|repair)\]/.test(line)) cls = "bk";
    return `<span class="t">${clock(t)}</span> <span class="${cls}">${esc(line)}</span>`;
  });
  const sig = lines.length + ":" + (data.log_tail.length ? data.log_tail[data.log_tail.length - 1].line : "");
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.innerHTML = lines.join("\n");
  if ($("follow-log").checked) el.scrollTop = el.scrollHeight;
  $("log-meta").textContent = data.run ? `${data.run.dir}/flow.log` : "";
}

// ================================================================ terminal
// flow.py in a pseudo-terminal on the server (gui/flow_terminal.py): output
// arrives as server-sent events, keystrokes go back as POSTs.
const term = (() => {
  let xt = null, fit = null, es = null, fb = null;
  let st = { available: false }, sendQ = "", sendT = null, chain = Promise.resolve(), chosenTab = null;
  const post = (path, body, raw) => fetch(path, {
    method: "POST",
    headers: { "X-Flow-Token": TOKEN, "Content-Type": raw ? "application/octet-stream" : "application/json" },
    body: raw ? body : JSON.stringify(body || {}),
  }).then((r) => r.json());

  function send(s) {
    if (!st.running) return;
    sendQ += s;
    if (!sendT) sendT = setTimeout(() => {
      const chunk = new TextEncoder().encode(sendQ); sendQ = ""; sendT = null;
      chain = chain.then(() => post("/api/term/input", chunk, true)).catch(() => {});
    }, 8);
  }

  // ---- without xterm.js (offline): plain text, one line of input
  const ANSI = /\x1b\[[0-9;?]*[ -\/]*[@-~]|\x1b\][^\x07]*\x07|\x1b[()][0-9A-B]/g;
  function fbInit(el) {
    el.innerHTML = `<pre class="fb"></pre><input class="fb-in" placeholder="type here, Enter sends (xterm.js did not load: basic mode)">`;
    fb = { pre: el.querySelector(".fb"), text: "", dec: new TextDecoder() };
    el.querySelector(".fb-in").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { send(e.target.value + "\r"); e.target.value = ""; }
      if (e.key === "c" && e.ctrlKey) send("\x03");
    });
  }
  function fbWrite(u8) {
    let t = fb.dec.decode(u8, { stream: true }).replace(ANSI, "").replace(/\r\n/g, "\n").replace(/\r/g, "");
    for (const ch of t) fb.text = ch === "\b" ? fb.text.slice(0, -1) : fb.text + ch;
    if (fb.text.length > 400000) fb.text = fb.text.slice(-300000);
    fb.pre.textContent = fb.text; fb.pre.scrollTop = fb.pre.scrollHeight;
  }

  function init() {
    const el = $("term");
    if (window.Terminal) {
      xt = new Terminal({
        fontFamily: getComputedStyle(document.documentElement).getPropertyValue("--mono"), fontSize: 13,
        cursorBlink: true, scrollback: 20000, allowProposedApi: false,
        theme: { background: "#0b0f17", foreground: "#d7deea", cursor: "#7c9cff", selectionBackground: "#7c9cff55" },
      });
      if (window.FitAddon) { fit = new FitAddon.FitAddon(); xt.loadAddon(fit); }
      xt.open(el);
      xt.onData(send);
    } else fbInit(el);
  }
  function write(u8) { xt ? xt.write(u8) : fbWrite(u8); }

  function connect() {
    if (es || !TOKEN) return;
    es = new EventSource(`/api/term/stream?token=${encodeURIComponent(TOKEN)}&from=0`);
    es.onmessage = (e) => {
      if (!e.data) return;
      const bin = atob(e.data), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      write(u8);
    };
    es.addEventListener("reset", () => { if (xt) xt.reset(); else if (fb) { fb.text = ""; fb.pre.textContent = ""; } });
  }

  function size() {
    if (fit && !$("pane-term").hidden) { try { fit.fit(); } catch (e) {} }
    return xt ? { cols: xt.cols, rows: xt.rows } : { cols: 110, rows: 30 };
  }
  function resized() {
    const sz = size();
    if (st.running) post("/api/term/resize", sz).catch(() => {});
  }

  function show(tab, remember) {
    $("pane-term").hidden = tab !== "term";
    $("pane-log").hidden = tab !== "log";
    $("pane-test").hidden = tab !== "test";
    $("follow-wrap").hidden = tab !== "log";
    $("tab-term").classList.toggle("on", tab === "term");
    $("tab-log").classList.toggle("on", tab === "log");
    $("tab-test").classList.toggle("on", tab === "test");
    if (remember) { chosenTab = tab; try { localStorage.setItem("flowgui.tab", tab); } catch (e) {} }
    if (tab === "term") { resized(); xt && xt.focus(); }
  }
  try { chosenTab = localStorage.getItem("flowgui.tab"); } catch (e) {}
  $("tab-term").addEventListener("click", () => show("term", true));
  $("tab-log").addEventListener("click", () => show("log", true));
  $("tab-test").addEventListener("click", () => show("test", true));
  window.showTab = show;
  window.addEventListener("resize", () => { clearTimeout(window._trz); window._trz = setTimeout(resized, 120); });

  $("term-start").addEventListener("click", async () => {
    const r = await post("/api/term/start", { args: $("term-args").value, ...size() }).catch((e) => ({ error: String(e) }));
    if (r.error) { $("term-state").textContent = r.error; return; }
    st = r;
    // the run this starts will be the newest: watch it
    follow = true; selected = null; history.replaceState(null, "", location.pathname);
    chip.reset(); setTimeout(poll, 1500);
    paint(); xt && xt.focus();
  });
  $("term-int").addEventListener("click", () => { post("/api/term/interrupt").catch(() => {}); xt && xt.focus(); });
  $("term-args").addEventListener("keydown", (e) => { if (e.key === "Enter" && !st.running) $("term-start").click(); });
  document.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => {
    if (st.running) return;
    $("term-args").value = b.hasAttribute("data-resume")
      ? (data && data.run ? `--resume ${data.run.dir}` : "") : b.dataset.args;
    $("term-args").focus();
  }));

  function paint() {
    const run = st.running;
    $("term-start").disabled = run;
    $("term-int").disabled = !run;
    $("term-args").disabled = run;
    if (run && st.args && document.activeElement !== $("term-args")) $("term-args").value = st.args.join(" ");
    document.querySelectorAll(".chips button").forEach((b) => (b.disabled = run));
    let txt = "";
    if (run) txt = `running · pid ${st.pid} · ${dur(nowS() - st.started)}`;
    else if (st.exit_code != null) txt = `last run exited with code ${st.exit_code}`;
    else txt = "no run started from this page";
    $("term-state").textContent = txt;
    $("tab-term").innerHTML = "Terminal" + (run ? '<span class="live"></span>' : "");
  }

  return {
    update(s) {
      st = s;
      const on = s.available && !!TOKEN;
      $("term-ui").hidden = !on;
      $("term").hidden = !on;
      $("term-off").hidden = on;
      if (!on) $("term-off").textContent = `Terminal unavailable: ${s.reason || "watch-only page"}. ` +
        "Output still shows in the flow.log tab.";
      if (on && !xt && !fb) { init(); connect(); }
      if (!this._shown) {     // first status only: the remembered tab, else the terminal when there is one
        show(!on ? "log" : (chosenTab || "term"), false);
        this._shown = true;
      }
      if (on) paint();
    },
  };
})();

$("run-select").addEventListener("change", (e) => {
  const v = e.target.value;
  follow = v === "__follow"; selected = follow ? null : v;
  chip.reset(); poll();
  history.replaceState(null, "", follow ? location.pathname : `?run=${encodeURIComponent(v)}`);
});
$("replay").addEventListener("click", () => chip.replay());

// ================================================================ the chip
// A procedurally drawn sky130-style layout of the controller. Each layer is
// tied to one backend step, so the chip assembles in the order ORFS builds it:
// blocks (RTL) -> gates (synth) -> die, rows, power grid (floorplan) ->
// standard cells (place) -> clock tree (cts) -> congestion map (grt) ->
// metal wires and vias (route) -> fill + seal ring (finish) -> sign-off scan.
const chip = (() => {
  const W = 1000;                         // logical units, square
  const CORE = { x: 70, y: 70, w: 860, h: 860 };
  const ROW_H = 9;
  const CELL_COLORS = ["#e8d36a", "#7fd18b", "#5ec8e0", "#e889c5", "#b9a5f0", "#f2a65a"];
  const MET = {
    m1: { c: "#5b8cff", w: 1.1 }, m2: { c: "#e05ad8", w: 1.3 },
    m3: { c: "#8fb4ff", w: 1.7 }, m4: { c: "#c86bff", w: 1.7 },
  };
  const layers = {};
  for (const n of ["floor", "synth", "cells", "grt", "cts", "route", "finish", "over"]) {
    const cv = $("c-" + n);
    layers[n] = { cv, ctx: cv.getContext("2d"), drawn: 0 };
  }
  const FONT = getComputedStyle(document.body).fontFamily;
  let px = 800, scale = 0.8, model = null, modelSig = "";
  const disp = { rtl: 0, synth: 0, floorplan: 0, place: 0, cts: 0, grt: 0, route: 0, finish: 0, signoff: 0, sta: 0 };
  const target = { ...disp };
  const ORDER = ["rtl", "synth", "floorplan", "place", "cts", "grt", "route", "finish", "signoff", "sta"];
  let blockState = {}, result = null, active = null, lastFloorSig = "", lastFinish = -1, replayT = 0;
  // real per-step frames (gui/chip_render.py); empty when Docker is absent
  let realFrames = [], realShown = null, realTop = false, stepDetail = "";

  function resize() {
    const r = $("chip-stage").getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    px = Math.max(200, Math.round(r.width * dpr));
    scale = px / W;
    for (const L of Object.values(layers)) {
      L.cv.width = px; L.cv.height = px; L.drawn = 0;
      L.ctx.setTransform(scale, 0, 0, scale, 0, 0);
    }
    lastFloorSig = ""; lastFinish = -1;
  }

  // ---- model: blocks (treemap by real cell counts), cells, nets, clock tree
  // squarified treemap (Bruls et al.): keeps blocks close to square
  function treemap(items, rect, out) {
    const total = items.reduce((a, b) => a + b.v, 0);
    const area = rect.w * rect.h;
    const sized = items.map((it) => ({ ...it, a: (it.v / total) * area }));
    let r = { ...rect };
    const worst = (row, side) => {
      const s = row.reduce((a, b) => a + b.a, 0);
      let w = 0;
      for (const it of row) w = Math.max(w, Math.max((side * side * it.a) / (s * s), (s * s) / (side * side * it.a)));
      return w;
    };
    const lay = (row) => {
      const s = row.reduce((a, b) => a + b.a, 0);
      if (r.w >= r.h) {              // column on the left
        const cw = s / r.h; let y = r.y;
        for (const it of row) { const h = it.a / cw; out.push({ ...it, x: r.x, y, w: cw, h }); y += h; }
        r = { x: r.x + cw, y: r.y, w: r.w - cw, h: r.h };
      } else {                       // row on top
        const rh = s / r.w; let x = r.x;
        for (const it of row) { const w = it.a / rh; out.push({ ...it, x, y: r.y, w, h: rh }); x += w; }
        r = { x: r.x, y: r.y + rh, w: r.w, h: r.h - rh };
      }
    };
    let row = [];
    for (const it of sized) {
      const side = Math.min(r.w, r.h);
      if (!row.length || worst(row.concat(it), side) <= worst(row, side)) row.push(it);
      else { lay(row); row = [it]; }
    }
    if (row.length) lay(row);
  }

  function build(blockCells, phaseModules) {
    const rnd = mulberry32(403);
    const phaseOf = {};
    for (const [p, ms] of Object.entries(phaseModules)) for (const m of ms) phaseOf[m] = p;
    // soften the spread so tiny blocks are still visible
    let items = Object.entries(blockCells).map(([name, n]) => ({ name, n, v: Math.pow(Math.max(n, 30), 0.72), phase: phaseOf[name] || "top" }));
    items.sort((a, b) => b.v - a.v);
    const blocks = [];
    treemap(items, { ...CORE }, blocks);
    const G = 5;
    for (const b of blocks) { b.x += G; b.y += G; b.w -= 2 * G; b.h -= 2 * G; }

    // cells packed into rows of each block
    const VIS = 2600, totalN = blocks.reduce((a, b) => a + b.v, 0);
    const cells = [];
    for (const b of blocks) {
      const want = Math.max(14, Math.round(VIS * b.v / totalN));
      const rows = [];
      for (let y = Math.ceil((b.y + 2) / ROW_H) * ROW_H; y + ROW_H <= b.y + b.h - 1; y += ROW_H) rows.push(y);
      const avail = rows.length * (b.w - 4);
      const avgW = Math.max(2.5, Math.min(14, (avail * 0.62) / want));
      let ri = 0, x = b.x + 2 + rnd() * 3, placed = 0;
      while (placed < want && ri < rows.length) {
        const w = avgW * (0.45 + rnd() * 1.1);
        if (x + w > b.x + b.w - 2) { ri++; x = b.x + 2 + rnd() * 4; continue; }
        if (rnd() < 0.7) {
          cells.push({ x, y: rows[ri] + 0.8, w, h: ROW_H - 1.6, c: CELL_COLORS[Math.floor(rnd() * CELL_COLORS.length)],
            b: b.name, sx: b.x + rnd() * b.w, sy: b.y + rnd() * b.h, o: rnd() });
          placed++;
        }
        x += w + avgW * (0.05 + rnd() * 0.6);
      }
      b.rows = rows;
    }
    // placement reveals in a sweep from the center outward with jitter
    const cx = W / 2, cy = W / 2;
    cells.forEach((c) => { c.k = Math.hypot(c.x - cx, c.y - cy) / 600 + c.o * 0.55; });
    cells.sort((a, b) => a.k - b.k);
    const synthDots = cells.slice().sort((a, b) => a.o - b.o);

    // nets: L-shaped wires between cells, mostly within a block
    const byBlock = {};
    cells.forEach((c) => (byBlock[c.b] = byBlock[c.b] || []).push(c));
    const nets = [];
    const snap = (v, g) => Math.round(v / g) * g;
    for (let i = 0; i < 1250; i++) {
      const a = cells[Math.floor(rnd() * cells.length)];
      let b;
      const local = rnd() < 0.9;
      if (local) {
        const pool = byBlock[a.b];
        b = pool[Math.floor(rnd() * pool.length)];
        if (Math.abs(b.x - a.x) + Math.abs(b.y - a.y) > 160) continue;
      } else b = cells[Math.floor(rnd() * cells.length)];
      if (a === b) continue;
      const ax = snap(a.x + a.w / 2, 2), ay = snap(a.y + a.h / 2, 3);
      const bx = snap(b.x + b.w / 2, 2), by = snap(b.y + b.h / 2, 3);
      const hi = !local || Math.abs(bx - ax) + Math.abs(by - ay) > 180;
      nets.push({ ax, ay, bx, by, h: hi ? "m3" : "m1", v: hi ? "m4" : "m2", vf: rnd() < 0.5, k: rnd() + (hi ? 0.35 : 0) });
    }
    nets.sort((a, b) => a.k - b.k);

    // clock H-tree
    const tree = [];
    (function h(x, y, len, lvl, horiz) {
      if (lvl > 6) return;
      const [x1, y1, x2, y2] = horiz ? [x - len, y, x + len, y] : [x, y - len, x, y + len];
      tree.push({ x1, y1, x2, y2, lvl });
      const nl = horiz ? len * 0.72 : len * 0.72;
      h(x1, y1, nl, lvl + 1, !horiz);
      h(x2, y2, nl, lvl + 1, !horiz);
    })(W / 2, W / 2, 215, 0, true);
    tree.sort((a, b) => a.lvl - b.lvl);

    // congestion map
    const GN = 26, gw = CORE.w / GN, gcells = [];
    for (let i = 0; i < GN; i++) for (let j = 0; j < GN; j++) {
      const x = CORE.x + i * gw, y = CORE.y + j * gw;
      const d = Math.hypot(x + gw / 2 - cx, y + gw / 2 - cy) / 600;
      gcells.push({ x, y, w: gw, v: Math.max(0, Math.min(1, 0.75 - d * 0.9 + (rnd() - 0.5) * 0.55)), k: rnd() });
    }
    gcells.sort((a, b) => a.k - b.k);

    // IO pins
    const pins = [];
    for (let i = 0; i < 128; i++) {
      const side = i % 4, t = 0.06 + 0.88 * ((Math.floor(i / 4) + rnd() * 0.5) / 32);
      pins.push({ side, t, m: rnd() < 0.5 ? "m3" : "m2" });
    }
    // metal fill
    const fill = [];
    for (let i = 0; i < 900; i++) fill.push({ x: CORE.x + rnd() * CORE.w, y: CORE.y + rnd() * CORE.h, w: 3 + rnd() * 6, m: rnd() < 0.5 });

    return { blocks, cells, synthDots, nets, tree, gcells, pins, fill };
  }

  // ---- static-ish layers
  function drawFloor(ctx, f, rtl) {
    ctx.clearRect(0, 0, W, W);
    // die
    ctx.fillStyle = "#0d1320";
    ctx.fillRect(30, 30, W - 60, W - 60);
    ctx.strokeStyle = "#2a3550"; ctx.lineWidth = 1.5;
    ctx.strokeRect(30, 30, W - 60, W - 60);
    if (f <= 0) return;
    // core + rows
    const rowF = Math.min(1, f / 0.45);
    ctx.strokeStyle = "rgba(120,140,190,0.10)"; ctx.lineWidth = 0.6;
    const nRows = Math.floor(CORE.h / ROW_H);
    ctx.beginPath();
    for (let i = 0; i <= nRows * rowF; i++) {
      const y = CORE.y + i * ROW_H;
      ctx.moveTo(CORE.x, y); ctx.lineTo(CORE.x + CORE.w, y);
    }
    ctx.stroke();
    ctx.strokeStyle = "rgba(124,156,255,0.35)"; ctx.lineWidth = 1;
    ctx.strokeRect(CORE.x, CORE.y, CORE.w, CORE.h);
    // IO pins
    const pinF = Math.min(1, f / 0.6);
    model.pins.forEach((p, i) => {
      if (i / model.pins.length > pinF) return;
      ctx.fillStyle = MET[p.m].c;
      const L = 40, t = 30 + p.t * (W - 60);
      if (p.side === 0) ctx.fillRect(t - 2, 30, 4, L - 6);
      if (p.side === 1) ctx.fillRect(W - 30 - L + 6, t - 2, L - 6, 4);
      if (p.side === 2) ctx.fillRect(t - 2, W - 30 - L + 6, 4, L - 6);
      if (p.side === 3) ctx.fillRect(30, t - 2, L - 6, 4);
    });
    // power grid: met4 verticals, met5 horizontals, plus core rings
    const pdnF = Math.max(0, (f - 0.45) / 0.55);
    if (pdnF > 0) {
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = "rgba(200,107,255,0.55)"; ctx.lineWidth = 6;
      ctx.strokeRect(CORE.x - 18, CORE.y - 18, CORE.w + 36, CORE.h + 36);
      ctx.strokeStyle = "rgba(91,140,255,0.5)";
      ctx.strokeRect(CORE.x - 9, CORE.y - 9, CORE.w + 18, CORE.h + 18);
      const nV = 14, nH = 7;
      for (let i = 0; i < nV; i++) {
        const k = i / nV; if (k > pdnF) break;
        const x = CORE.x + (i + 0.5) * (CORE.w / nV);
        ctx.fillStyle = "rgba(200,107,255,0.22)"; ctx.fillRect(x - 3, CORE.y - 18, 6, CORE.h + 36);
        ctx.fillStyle = "rgba(200,107,255,0.45)"; ctx.fillRect(x - 3, CORE.y - 18, 1.2, CORE.h + 36);
      }
      for (let j = 0; j < nH; j++) {
        const k = j / nH; if (k > pdnF) break;
        const y = CORE.y + (j + 0.5) * (CORE.h / nH);
        ctx.fillStyle = "rgba(91,140,255,0.20)"; ctx.fillRect(CORE.x - 18, y - 4, CORE.w + 36, 8);
        ctx.fillStyle = "rgba(91,140,255,0.5)"; ctx.fillRect(CORE.x - 18, y - 4, CORE.w + 36, 1.2);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawBlocks(ctx, t) {
    // block outlines + labels, on the overlay so they stay readable.
    // Not over a real frame: these rectangles are a treemap of cell counts,
    // so their POSITIONS are invented. Printing "scheduler" across a corner
    // of the actual layout would claim the block sits there, which nothing
    // in the treemap knows. Areas are real, places are not.
    if (realShown) return;
    const routeDim = 1 - disp.route * 0.55;
    for (const b of model.blocks) {
      const st = blockState[b.phase] || "pending";
      const vis = disp.rtl > 0 || st !== "pending";
      if (!vis) continue;
      let stroke = "rgba(120,140,190,0.25)", dash = [6, 6], lw = 1.2;
      if (st === "active") { stroke = "rgba(124,156,255,0.95)"; dash = [8, 6]; lw = 2; }
      else if (st === "pass") { stroke = blockState.validated ? "rgba(74,222,128,0.65)" : "rgba(124,156,255,0.6)"; dash = []; }
      else if (st === "fail" || st === "halt") { stroke = "rgba(248,113,113,0.85)"; dash = [4, 4]; lw = 2; }
      ctx.save();
      ctx.setLineDash(dash); ctx.lineDashOffset = st === "active" ? -t * 0.03 : 0;
      ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.globalAlpha = disp.synth > 0 ? 0.55 * routeDim + 0.15 : 1;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      if (disp.synth === 0 && st === "pass") { ctx.fillStyle = "rgba(124,156,255,0.05)"; ctx.fillRect(b.x, b.y, b.w, b.h); }
      ctx.restore();
      // label
      const fs = Math.max(10, Math.min(22, Math.min(b.w, b.h) / 6));
      if (b.w < 40 || b.h < 22) continue;
      ctx.save();
      ctx.globalAlpha = (st === "pending" ? 0.35 : 0.95) * (disp.place > 0.2 ? 0.75 * routeDim : 1);
      ctx.font = `600 ${fs}px ${FONT}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const tw = ctx.measureText(b.name).width;
      if (disp.place > 0.05) { ctx.fillStyle = "rgba(10,13,20,0.72)"; ctx.fillRect(cx - tw / 2 - 5, cy - fs * 0.75, tw + 10, fs * 1.5 + (b.h > 70 ? fs * 0.8 : 0)); }
      ctx.fillStyle = st === "active" ? "#c7d2fe" : "#e6ebf5";
      ctx.fillText(b.name, cx, cy);
      if (b.h > 70) {
        ctx.font = `500 ${fs * 0.62}px ${FONT}`;
        ctx.fillStyle = "#8592a8";
        ctx.fillText(`${b.n.toLocaleString()} cells · phase ${b.phase}`, cx, cy + fs * 0.95);
      }
      ctx.restore();
    }
  }

  // ---- incremental layers
  function inc(L, total, frac, drawOne, clear) {
    const want = Math.floor(total * Math.max(0, Math.min(1, frac)));
    if (want < L.drawn) { L.ctx.clearRect(0, 0, W, W); L.drawn = 0; clear && clear(); }
    for (let i = L.drawn; i < want; i++) drawOne(L.ctx, i);
    const added = want - L.drawn;
    L.drawn = want;
    return added;
  }

  function drawCell(ctx, i) {
    const c = model.cells[i];
    ctx.globalAlpha = 0.5; ctx.fillStyle = c.c; ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.globalAlpha = 0.95; ctx.strokeStyle = c.c; ctx.lineWidth = 0.5; ctx.strokeRect(c.x, c.y, c.w, c.h);
    if (c.w > 5) { ctx.globalAlpha = 0.6; ctx.fillStyle = "#e889c5"; ctx.fillRect(c.x + c.w * 0.45, c.y - 0.6, 0.9, c.h + 1.2); }
    ctx.globalAlpha = 1;
  }
  function drawDot(ctx, i) {
    const c = model.synthDots[i];
    ctx.fillStyle = c.c; ctx.globalAlpha = 0.75;
    ctx.fillRect(c.sx - 1.4, c.sy - 1.4, 2.8, 2.8);
    ctx.globalAlpha = 1;
  }
  function drawVia(ctx, x, y) {
    ctx.fillStyle = "#a855f7"; ctx.fillRect(x - 1.8, y - 1.8, 3.6, 3.6);
    ctx.strokeStyle = "#e9d5ff"; ctx.lineWidth = 0.4; ctx.strokeRect(x - 1.8, y - 1.8, 3.6, 3.6);
  }
  function drawNet(ctx, i) {
    const n = model.nets[i];
    // L-shape: horizontal leg on m1/m3, vertical leg on m2/m4; half go vertical first
    const cx = n.vf ? n.ax : n.bx, cy = n.vf ? n.by : n.ay;
    ctx.lineCap = "square"; ctx.globalAlpha = 0.72;
    ctx.strokeStyle = MET[n.h].c; ctx.lineWidth = MET[n.h].w;
    ctx.beginPath(); ctx.moveTo(n.vf ? n.ax : n.ax, n.vf ? n.by : n.ay); ctx.lineTo(n.bx, cy); ctx.stroke();
    ctx.strokeStyle = MET[n.v].c; ctx.lineWidth = MET[n.v].w;
    ctx.beginPath(); ctx.moveTo(cx, n.ay); ctx.lineTo(cx, n.by); ctx.stroke();
    ctx.globalAlpha = 1;
    drawVia(ctx, n.ax, n.ay); drawVia(ctx, cx, cy); drawVia(ctx, n.bx, n.by);
  }
  function drawTree(ctx, i) {
    const s = model.tree[i];
    ctx.strokeStyle = "#ffd84a"; ctx.globalAlpha = 0.9; ctx.lineWidth = Math.max(0.8, 4 - s.lvl * 0.5);
    ctx.shadowColor = "#ffd84a"; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.shadowBlur = 0;
    if (s.lvl >= 5) { ctx.fillStyle = "#fff1a8"; ctx.fillRect(s.x1 - 2.5, s.y1 - 2.5, 5, 5); ctx.fillRect(s.x2 - 2.5, s.y2 - 2.5, 5, 5); }
    ctx.globalAlpha = 1;
  }
  function heat(v) {
    const r = Math.round(60 + 195 * Math.min(1, v * 1.4)), g = Math.round(90 + 120 * (1 - Math.abs(v - 0.5) * 2)), b = Math.round(255 * (1 - v));
    return `rgb(${r},${g},${b})`;
  }
  function drawG(ctx, i) {
    const g = model.gcells[i];
    ctx.globalAlpha = 0.18 + g.v * 0.35; ctx.fillStyle = heat(g.v);
    ctx.fillRect(g.x + 0.5, g.y + 0.5, g.w - 1, g.w - 1);
    ctx.globalAlpha = 1;
  }
  function drawFinish(ctx, f) {
    ctx.clearRect(0, 0, W, W);
    if (f <= 0) return;
    const nf = Math.floor(model.fill.length * Math.min(1, f / 0.6));
    for (let i = 0; i < nf; i++) {
      const m = model.fill[i];
      ctx.fillStyle = m.m ? "rgba(91,140,255,0.16)" : "rgba(224,90,216,0.14)";
      ctx.fillRect(m.x, m.y, m.w, m.w);
    }
    // seal ring drawn around the die
    const sf = Math.max(0, (f - 0.4) / 0.6);
    if (sf > 0) {
      const per = 4 * (W - 40);
      ctx.save();
      ctx.strokeStyle = "#e8d36a"; ctx.lineWidth = 4; ctx.shadowColor = "#e8d36a"; ctx.shadowBlur = 8;
      ctx.setLineDash([per * sf, per]);
      ctx.strokeRect(20, 20, W - 40, W - 40);
      ctx.restore();
    }
  }

  // ---- overlay (every frame)
  function drawOver(t) {
    const ctx = layers.over.ctx;
    ctx.clearRect(0, 0, W, W);
    drawBlocks(ctx, t);
    // placement: glow on the newest cells
    if (active === "place" && layers.cells.drawn > 0) {
      const i0 = Math.max(0, layers.cells.drawn - 40);
      ctx.save(); ctx.shadowColor = "#fff6c4"; ctx.shadowBlur = 10;
      for (let i = i0; i < layers.cells.drawn; i++) {
        const c = model.cells[i]; ctx.globalAlpha = (i - i0) / 40;
        ctx.strokeStyle = "#fff6c4"; ctx.lineWidth = 1; ctx.strokeRect(c.x, c.y, c.w, c.h);
      }
      ctx.restore();
    }
    // routing: router head on the latest net
    if (active === "route" && model.nets[layers.route.drawn - 1]) {
      const n = model.nets[layers.route.drawn - 1];
      const pulse = 6 + 3 * Math.sin(t / 150);
      ctx.save(); ctx.globalAlpha = 0.9;
      const g = ctx.createRadialGradient(n.bx, n.by, 0, n.bx, n.by, pulse * 3);
      g.addColorStop(0, "rgba(255,255,255,0.9)"); g.addColorStop(1, "rgba(224,90,216,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.bx, n.by, pulse * 3, 0, 7); ctx.fill();
      ctx.restore();
    }
    // synthesis: sparkles over blocks
    if (active === "synth") {
      const rnd = mulberry32(Math.floor(t / 90));
      for (let i = 0; i < 26; i++) {
        const b = model.blocks[Math.floor(rnd() * model.blocks.length)];
        const x = b.x + rnd() * b.w, y = b.y + rnd() * b.h;
        ctx.fillStyle = `rgba(232,211,106,${0.4 + rnd() * 0.6})`; ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
      }
    }
    // CTS: pulse traveling down the tree
    if (active === "cts" && layers.cts.drawn > 0) {
      const lvl = Math.floor((t / 220) % 7);
      ctx.save(); ctx.strokeStyle = "#fffbe6"; ctx.lineWidth = 2.5; ctx.shadowColor = "#ffd84a"; ctx.shadowBlur = 12;
      for (let i = 0; i < layers.cts.drawn; i++) {
        const s = model.tree[i]; if (s.lvl !== lvl) continue;
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      }
      ctx.restore();
    }
    // sign-off: scan line
    if (active === "signoff" || active === "sta") {
      const y = 30 + ((t / 9) % (W - 60));
      const g = ctx.createLinearGradient(0, y - 60, 0, y);
      g.addColorStop(0, "rgba(74,222,128,0)"); g.addColorStop(1, "rgba(74,222,128,0.28)");
      ctx.fillStyle = g; ctx.fillRect(30, y - 60, W - 60, 60);
      ctx.fillStyle = "rgba(167,243,208,0.9)"; ctx.fillRect(30, y, W - 60, 1.5);
      ctx.font = `700 15px ${FONT}`; ctx.fillStyle = "#bbf7d0";
      ctx.fillText(active === "sta" ? "STA" : "DRC · LVS", 40, y - 6);
    }
    // done: a sweep of light, then a stamp
    if (result === "pass" && disp.finish > 0.98) {
      const s = ((t - replayT) / 2600) % 3;
      if (s < 1) {
        const x = -300 + s * (W + 600);
        const g = ctx.createLinearGradient(x - 120, 0, x + 120, 0);
        g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,0.13)"); g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g; ctx.fillRect(30, 30, W - 60, W - 60);
      }
    }
    if (result === "fail" || result === "halt") {
      ctx.fillStyle = result === "fail" ? "rgba(248,113,113,0.08)" : "rgba(251,191,36,0.06)";
      ctx.fillRect(30, 30, W - 60, W - 60);
    }
  }

  // ---- per frame
  let lastT = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (!model) return;
    const dt = Math.min(100, t - (lastT || t)); lastT = t;
    // ease toward targets: quick enough to catch up after a jump, slow enough to watch
    // layers build in flow order: one only moves once the ones before it
    // have caught up, so a finished run replays like a time-lapse
    let blocked = false;
    for (const k of ORDER) {
      const d = target[k] - disp[k];
      if (d < 0) { disp[k] = target[k]; continue; }
      if (blocked) continue;
      disp[k] = Math.abs(d) < 0.002 ? target[k] : disp[k] + d * Math.min(1, dt / 700) + Math.min(d, dt / 4000);
      if (target[k] - disp[k] > 0.01) blocked = true;
    }
    const fsig = disp.floorplan.toFixed(3);
    if (fsig !== lastFloorSig) { drawFloor(layers.floor.ctx, disp.floorplan, disp.rtl); lastFloorSig = fsig; }
    inc(layers.synth, model.synthDots.length, disp.synth, drawDot);
    layers.synth.cv.style.opacity = String(Math.max(0.08, 1 - disp.place * 0.95));
    inc(layers.cells, model.cells.length, disp.place, drawCell);
    inc(layers.cts, model.tree.length, disp.cts, drawTree);
    inc(layers.grt, model.gcells.length, disp.grt, drawG);
    layers.grt.cv.style.opacity = String(Math.max(0, 0.85 - disp.route * 1.6));
    layers.cts.cv.style.opacity = String(1 - disp.route * 0.55);
    inc(layers.route, model.nets.length, disp.route, drawNet);
    const ff = Math.round(disp.finish * 200);
    if (ff !== lastFinish) { drawFinish(layers.finish.ctx, disp.finish); lastFinish = ff; }
    drawOver(t);
  }

  // Show the newest rendered frame. The incoming image is loaded before it
  // is faded up, so a half-decoded PNG never appears over a good one.
  function showFrame(fr, runId) {
    if (!fr) return;
    if (realShown === fr.file) return;
    const next = $(realTop ? "real-a" : "real-b");
    const prev = $(realTop ? "real-b" : "real-a");
    const url = `/api/frame?run=${encodeURIComponent(runId)}&name=${encodeURIComponent(fr.file)}`;
    const img = new Image();
    img.onload = () => {
      next.src = url;
      next.classList.add("on");
      prev.classList.remove("on");
      realTop = !realTop;
      realShown = fr.file;
      $("chip-stage").classList.add("real");
    };
    img.onerror = () => {};     // keep whatever is on screen
    img.src = url;
  }

  function setTag() {
    const names = { synth: "Synthesizing gates", floorplan: "Floorplanning: rows, pins, power grid", place: "Placing standard cells",
      cts: "Building the clock tree", grt: "Global routing: congestion map", route: "Detailed routing: metal + vias",
      finish: "Fill + seal ring → GDSII", signoff: "DRC / LVS sign-off scan", sta: "Static timing check",
      intake: "Backend intake check", packager: "Packaging for ORFS" };
    let html;
    if (active) {
      html = `<b>${names[active] || active}</b> · ${Math.round(target[active] * 100 || 0)}%`;
      // the step's own words (router iteration and violation count, and so
      // on) -- during a long hold this is the only thing that moves, and it
      // is the tool talking, not an animation
      if (stepDetail) html += ` · ${esc(stepDetail)}`;
      const shown = realFrames.find((f) => f.file === realShown);
      if (shown && shown.step !== active) html += ` · showing ${esc(shown.label.toLowerCase())}`;
    }
    else if (result === "pass") html = `<b>GDSII ready</b> · signed off`;
    else if (result === "fail") html = `<b style="color:var(--fail)">Backend failed</b>`;
    else if (data && data.current) html = `<b>${esc(labelOf(data.current.key))}</b> · ${data.current.key === "rtl_generation" ? "blocks appear as RTL is generated" : "waiting for backend"}`;
    else html = data && data.run ? `<b>${esc(data.run.status)}</b>` : "Waiting for a run…";
    $("phase-tag").innerHTML = html;
  }

  requestAnimationFrame(frame);
  return {
    resize,
    update(d) {
      const sig = JSON.stringify(d.block_cells);
      if (!model || sig !== modelSig) { model = build(d.block_cells, d.phase_modules); modelSig = sig; resize(); }
      const bk = d.backend;
      const by = Object.fromEntries(bk.steps.map((s) => [s.key, s]));
      const f = (k) => (by[k] && by[k].state !== "pending" ? (["done", "skip"].includes(by[k].state) ? 1 : by[k].frac) : 0);
      blockState = { ...d.rtl.phases, validated: d.rtl.validated };
      const anyRtl = Object.values(d.rtl.phases).some((s) => s !== "pending");
      const newPass = bk.orfs.pass;
      if (this._pass != null && newPass > this._pass) {   // a tuner pass rebuilds the layout
        for (const k of ["synth", "floorplan", "place", "cts", "grt", "route", "finish", "signoff", "sta"]) disp[k] = 0;
      }
      this._pass = newPass;
      Object.assign(target, {
        rtl: anyRtl ? 1 : 0, synth: f("synth"), floorplan: f("floorplan"), place: f("place"), cts: f("cts"),
        grt: f("grt"), route: f("route"), finish: f("finish"), signoff: f("signoff"), sta: f("sta"),
      });
      active = bk.current_step;
      result = bk.result || (d.run && d.run.status === "halted" && bk.started ? "halt" : null);
      const cells = bk.orfs.cells;
      const by2 = Object.fromEntries(bk.steps.map((s) => [s.key, s]));
      stepDetail = (active && by2[active] && by2[active].detail) || "";

      // real layout frames, newest wins
      realFrames = bk.orfs.frames || [];
      if (realFrames.length && d.run) showFrame(realFrames[realFrames.length - 1], d.run.id);
      if (!realFrames.length) { $("chip-stage").classList.remove("real"); realShown = null; }
      // the procedural chip survives as a motion cue over the real one,
      // and only while a step is running
      $("chip-stage").style.setProperty("--ghost", active ? 0.18 : 0);

      const real = realFrames.length > 0;
      $("chip-meta").textContent = `${bk.orfs.design || "ddr3_controller"} · ${d.platform}` +
        (cells ? ` · ${cells.toLocaleString()} cells` : "") +
        (real ? ` · real layout, ${realFrames.length} step frame${realFrames.length > 1 ? "s" : ""}`
              : " · illustrative, sized by block cell counts");
      setTag();
    },
    reset() {
      for (const k of Object.keys(disp)) disp[k] = 0;
      this._pass = null;
      realFrames = []; realShown = null;
      for (const id of ["real-a", "real-b"]) { $(id).classList.remove("on"); $(id).removeAttribute("src"); }
      $("chip-stage").classList.remove("real");
    },
    replay() { for (const k of Object.keys(disp)) if (k !== "rtl") disp[k] = 0; replayT = performance.now(); },
  };
})();

window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(() => chip.resize(), 150); });
poll();
</script>
</body>
</html>
