<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM MC Flow Monitor</title>
<style>
:root {
  --bg: #0a0d14;
  --panel: #111723;
  --panel-2: #161e2d;
  --line: #222c3f;
  --text: #e6ebf5;
  --muted: #8592a8;
  --faint: #4a5670;
  --accent: #7c9cff;
  --accent-2: #c86bff;
  --pass: #4ade80;
  --fail: #f87171;
  --halt: #fbbf24;
  --skip: #64748b;
  --active: #7c9cff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
body { min-height: 100vh; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 18px 20px 30px; }

/* header */
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; }
.brand .mark { width: 26px; height: 26px; border-radius: 6px;
  background: conic-gradient(from 45deg, #5b8cff, #e05ad8, #e8d36a, #4ade80, #5b8cff);
  box-shadow: 0 0 18px #7c9cff55; }
.brand small { color: var(--muted); font-weight: 450; }
.spacer { flex: 1; }
select, button {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer;
}
select { max-width: 380px; }
button:hover, select:hover { border-color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.running .dot { background: var(--active); box-shadow: 0 0 0 0 #7c9cff; animation: ping 1.6s infinite; }
.pill.complete .dot, .pill.done .dot { background: var(--pass); }
.pill.halted .dot { background: var(--halt); }
.pill.failed .dot { background: var(--fail); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 #7c9cffaa; } 80%,100% { box-shadow: 0 0 0 8px #7c9cff00; } }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* stage strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; margin-bottom: 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; }
.stage { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 0 6px; min-width: 0; }
.stage::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 2px;
  background: var(--line); z-index: 0; }
.stage:first-child::before { display: none; }
.stage.pass::before, .stage.active::before, .stage.fail::before, .stage.halt::before,
.stage.skip::before, .stage.loop::before { background: linear-gradient(90deg, var(--pass), var(--line)); }
.node { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel-2); border: 2px solid var(--line); font-size: 14px; font-weight: 700; color: var(--muted); }
.stage.pass .node { border-color: var(--pass); color: var(--pass); background: #4ade8014; }
.stage.fail .node { border-color: var(--fail); color: var(--fail); background: #f8717114; }
.stage.halt .node { border-color: var(--halt); color: var(--halt); background: #fbbf2414; }
.stage.skip .node { border-color: var(--skip); color: var(--skip); }
.stage.loop .node { border-color: var(--accent-2); color: var(--accent-2); }
.stage.active .node { border-color: var(--active); color: var(--active); background: #7c9cff1c;
  animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 6px #7c9cff22, 0 0 22px #7c9cff55; } }
.stage.backend .node { width: 38px; height: 38px; margin-top: -3px; }
.stage .lab { margin-top: 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 100%; }
.stage .sub { margin-top: 2px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-height: 15px; }
.stage.active .lab { color: var(--active); }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, 1fr); gap: 16px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.card h2 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }

.chip-card { overflow: hidden; }
.chip-stage { position: relative; aspect-ratio: 1 / 1; width: 100%; background: radial-gradient(circle at 50% 45%, #121a2b, #070a10 75%); }
.chip-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .6s; }
/* The real layout OpenROAD rendered for each ORFS step, two stacked so a
   new frame crossfades into the last one instead of flicking over. */
.chip-stage img.real { position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
.chip-stage img.real.on { opacity: 1; }
/* Once a real frame is up the procedural chip stops being the picture and
   becomes the "still working" overlay: --ghost is raised only while a step
   is actually running, so a long hold (detailed routing runs 25+ min on one
   frame) still has something moving over the real layout. */
.chip-stage.real canvas.struct { opacity: var(--ghost, 0); }
.chip-caption { position: absolute; left: 14px; bottom: 12px; right: 14px; display: flex; justify-content: space-between;
  align-items: flex-end; gap: 8px; pointer-events: none; }
.phase-tag { background: #0a0d14cc; border: 1px solid var(--line); backdrop-filter: blur(4px);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.phase-tag b { color: var(--accent); font-weight: 650; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); background: #0a0d14cc;
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.legend i { display: inline-block; width: 10px; height: 4px; border-radius: 1px; margin-right: 4px; vertical-align: middle; }

/* backend panel */
.bk-top { padding: 18px 18px 6px; }
.bk-row { display: flex; align-items: baseline; gap: 12px; }
.bk-pct { font-size: 56px; font-weight: 750; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; line-height: 1; }
.bk-pct small { font-size: 24px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.bk-eta { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bk-eta b { display: block; color: var(--text); font-size: 18px; font-weight: 650; }
.bar { position: relative; height: 16px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line);
  overflow: hidden; margin: 14px 0 10px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 999px;
  background: linear-gradient(90deg, #5b8cff, #a77bff 55%, #e05ad8); transition: width 1.2s cubic-bezier(.2,.7,.2,1);
  box-shadow: 0 0 18px #a77bff66; }
.bar.active .fill::after { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(-45deg, #ffffff22 0 10px, transparent 10px 20px);
  animation: slide 1s linear infinite; }
@keyframes slide { to { background-position: 28px 0; } }
.bar.pass .fill { background: linear-gradient(90deg, #22c55e, #4ade80); box-shadow: 0 0 16px #4ade8066; }
.bar.fail .fill { background: linear-gradient(90deg, #ef4444, #f87171); }
.bar .ticks { position: absolute; inset: 0; pointer-events: none; }
.bar .ticks span { position: absolute; top: 0; bottom: 0; width: 1px; background: #0a0d1499; }
.now { font-size: 15px; font-weight: 600; min-height: 22px; }
.now .detail { color: var(--muted); font-weight: 450; font-size: 13px; margin-left: 6px; font-family: var(--mono); }
.banner { margin: 10px 18px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
.banner.halt { background: #fbbf2414; border: 1px solid #fbbf2455; color: #fde68a; }
.banner.fail { background: #f8717114; border: 1px solid #f8717155; color: #fecaca; }
.banner.info { background: #7c9cff12; border: 1px solid #7c9cff40; color: #c7d2fe; }
.banner.pass { background: #4ade8012; border: 1px solid #4ade8044; color: #bbf7d0; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 18px 4px; }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.tile .v { font-size: 17px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.tile .v.good { color: var(--pass); } .tile .v.bad { color: var(--fail); }

.steps { list-style: none; margin: 0; padding: 10px 10px 12px; }
.step { display: grid; grid-template-columns: 24px 1fr 118px 64px; align-items: center; gap: 8px; padding: 6px 8px;
  border-radius: 8px; font-size: 13.5px; }
.step.active { background: #7c9cff12; }
.step .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px;
  border: 1.5px solid var(--faint); color: var(--faint); }
.step.done .ic { border-color: var(--pass); background: var(--pass); color: #04210f; }
.step.fail .ic { border-color: var(--fail); background: var(--fail); color: #2a0606; }
.step.halt .ic { border-color: var(--halt); color: var(--halt); }
.step.skip .ic { border-color: var(--skip); color: var(--skip); }
.step.active .ic { border-color: var(--active); border-top-color: transparent; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.step .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.pending .nm { color: var(--muted); }
.step .mini { height: 5px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.step .mini b { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 1s; }
.step.done .mini b { background: var(--pass); }
.step.fail .mini b { background: var(--fail); }
.step .tm { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.step.orfs .nm::before { content: "ORFS"; font-size: 9.5px; font-weight: 700; letter-spacing: .5px; color: var(--accent-2);
  border: 1px solid #c86bff55; border-radius: 4px; padding: 0 3px; margin-right: 6px; vertical-align: 1px; }
.notes { padding: 0 18px 14px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.notes div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* log */
.log-card { margin-top: 16px; }
.log { height: 260px; overflow: auto; padding: 10px 14px; font: 12px/1.55 var(--mono); color: #b6c0d3; white-space: pre; }
.log .t { color: var(--faint); }
.log .cmd { color: #67e8f9; }
.log .ok { color: var(--pass); }
.log .bad { color: var(--fail); }
.log .warn { color: var(--halt); }
.log .bk { color: #d8b4fe; }
label.chk { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tab { background: none; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 13px; font-weight: 650;
  letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.tab.on { background: var(--panel-2); color: var(--text); }
.tab .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pass);
  margin-left: 6px; vertical-align: 1px; animation: ping 1.6s infinite; }
.term-bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px 6px; flex-wrap: wrap; }
.term-bar .prompt { font: 13px var(--mono); color: #67e8f9; white-space: nowrap; }
.term-bar input { flex: 1; min-width: 200px; background: #0b0f17; color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font: 13px var(--mono); }
.term-bar input:focus { outline: none; border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #0a0d14; font-weight: 650; }
button.primary:hover { filter: brightness(1.1); }
button:disabled { opacity: .45; cursor: not-allowed; }
.chips { display: flex; gap: 6px; align-items: center; padding: 0 14px 10px; flex-wrap: wrap; }
.chips button { font-size: 12px; padding: 4px 9px; border-radius: 999px; }
.chips .meta { margin-left: auto; }
#term { height: 460px; padding: 8px 4px 8px 12px; background: #0b0f17; border-top: 1px solid var(--line);
  border-radius: 0 0 14px 14px; overflow: hidden; }
.term-off { padding: 26px 18px; color: var(--muted); font-size: 13.5px; }
.fb { margin: 0; height: 400px; overflow: auto; font: 12.5px/1.5 var(--mono); color: #d7deea; white-space: pre-wrap; }
.fb-in { width: 100%; margin-top: 6px; background: #111723; color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; font: 13px var(--mono); }

/* frontend + validation */
.main2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-top: 16px; }
.phase-rows { padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 8px; }
.phase-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.phase-row .pn { width: 54px; font-size: 12px; color: var(--muted); font-weight: 650; flex-shrink: 0; }
.phase-row .pn.active { color: var(--active); }
.phase-row .pn.fail { color: var(--fail); }
.mod-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.mod-chip.pass { border-color: #4ade8055; color: var(--pass); }
.mod-chip.fail { border-color: #f8717166; color: var(--fail); background: #f8717114; }
.mod-chip.active { border-color: var(--active); color: var(--active); }
.mod-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.fixhist { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow: auto; }
.fix-ev { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; padding: 6px 9px; border-radius: 8px;
  background: var(--panel-2); border: 1px solid var(--line); }
.fix-ev .ic { width: 14px; text-align: center; flex-shrink: 0; font-size: 12px; }
.fix-ev.fixed { border-color: #4ade8044; } .fix-ev.fixed .ic { color: var(--pass); }
.fix-ev.unresolved, .fix-ev.error { border-color: #f8717144; } .fix-ev.unresolved .ic, .fix-ev.error .ic { color: var(--fail); }
.fix-ev.retry, .fix-ev.active { border-color: #fbbf2444; } .fix-ev.retry .ic, .fix-ev.active .ic { color: var(--halt); }
.fix-ev .mod { font-weight: 650; }
.fix-ev .trig { color: var(--muted); margin-left: auto; font-size: 11px; white-space: nowrap; }

.pathgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; padding: 4px 16px 16px; }
.path-chip { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; font-size: 11.5px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; }
.path-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
.path-chip.pass .dot { background: var(--pass); } .path-chip.pass { color: var(--pass); }
.path-chip.fail .dot { background: var(--fail); } .path-chip.fail { color: var(--fail); border-color: #f8717155; background: #f8717112; }
.path-chip .nm { overflow: hidden; text-overflow: ellipsis; }
.path-chip { cursor: pointer; }
.path-chip.sel { outline: 1px solid var(--accent); outline-offset: 1px; }
.path-chip.other .dot { background: var(--accent-2); }

/* validation detail: one path's stage checkers, findings, formal */
.val-note { margin: 0 16px 8px; font-size: 11.5px; color: var(--muted); }
.val-detail { margin: 0 16px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); overflow: hidden; }
.val-detail .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.val-detail .hd .nm { font-weight: 650; font-family: var(--mono); font-size: 12px; }
.val-detail .hd .meta { font-size: 11px; }
.val-detail .hd .spacer { flex: 1; }
button.sm { font-size: 11px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
button.sm:hover { border-color: var(--accent); }
.stage-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.stage-tbl td, .stage-tbl th { padding: 5px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
.stage-tbl th { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; border-top: 0; }
.stage-tbl .st { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.v-pass { color: var(--pass); } .v-fail { color: var(--fail); } .v-other { color: var(--muted); }
.stage-tbl .sum { color: var(--muted); font-size: 11.5px; word-break: break-word; }
.stage-tbl .det { font-family: var(--mono); font-size: 11px; color: var(--fail); white-space: pre-wrap; margin-top: 3px; line-height: 1.4; }
.subhead { padding: 8px 16px 6px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; display: flex; gap: 8px; align-items: baseline; }
.subhead .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 11.5px; }
.findings { padding: 0 16px 10px; display: flex; flex-direction: column; gap: 6px; }
.finding { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 7px 10px; font-size: 12.5px; cursor: pointer; }
.finding.critical { border-color: #f8717166; } .finding.major { border-color: #fbbf2455; } .finding.awaiting_formal { border-color: #7c9cff44; }
.finding .row1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.finding .sev { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; }
.finding .sev.critical { color: var(--fail); } .finding .sev.major { color: var(--halt); } .finding .sev.minor { color: var(--muted); }
.finding .own { font-weight: 650; } .finding .chk { font-family: var(--mono); font-size: 11.5px; }
.finding .meta2 { color: var(--muted); margin-left: auto; font-size: 11px; white-space: nowrap; }
.finding .body { display: none; margin-top: 6px; font-size: 11.5px; color: var(--muted); white-space: pre-wrap; font-family: var(--mono); line-height: 1.45; }
.finding.open .body { display: block; }
.formal-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 16px 14px; }
.fchip { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); }
.fchip.proven, .fchip.bounded_proven, .fchip.covered { color: var(--pass); border-color: #4ade8055; }
.fchip.cex { color: var(--fail); border-color: #f8717166; }
.fchip.undetermined, .fchip.bounded_vacuous, .fchip.proven_vacuous { color: var(--halt); border-color: #fbbf2444; }

.banner.loop { background: #c86bff14; border: 1px solid #c86bff55; color: #ecd3ff; animation: loopglow 1.8s ease-in-out infinite; }
@keyframes loopglow { 0%,100% { box-shadow: 0 0 0 0 #c86bff00; } 50% { box-shadow: 0 0 0 4px #c86bff22; } }

.empty { padding: 60px 20px; text-align: center; color: var(--muted); }

@media (max-width: 1000px) {
  .main, .main2 { grid-template-columns: 1fr; }
  .strip { grid-template-columns: repeat(4, 1fr); row-gap: 16px; }
  .stage:nth-child(5)::before { display: none; }
}
@media (max-width: 560px) {
  .wrap { padding: 12px 16px 24px; }
  .strip { grid-template-columns: repeat(2, 1fr); }
  .stage::before { display: none; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .step { grid-template-columns: 24px 1fr 60px; }
  .step .mini { display: none; }
  .bk-pct { font-size: 44px; }
  select { max-width: 100%; }
}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark"></div>LLM MC #1 <small>flow monitor</small></div>
    <span id="status" class="pill"><span class="dot"></span><span id="status-text">connecting…</span></span>
    <span class="meta" id="elapsed"></span>
    <div class="spacer"></div>
    <select id="run-select" title="Run to watch"></select>
    <button id="replay" title="Rebuild the chip animation from scratch">Replay build</button>
  </header>

  <section class="strip" id="strip"></section>

  <section class="main">
