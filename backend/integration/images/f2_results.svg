    <rect x="24" y="500" width="952" height="48" fill="#f5f7fa"/>
    <text x="44" y="530" fill="#16243a">refresh_ctrl</text><text x="330" y="530" fill="#16243a" text-anchor="middle">+1.247 ns</text><text x="500" y="530" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="530" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="530" fill="#1a7f46" text-anchor="middle" font-weight="600">YES</text>
    <rect x="24" y="548" width="952" height="48" fill="#fdf2f2"/>
    <text x="44" y="578" fill="#16243a" font-weight="600">scheduler</text><text x="330" y="578" fill="#b3261e" text-anchor="middle" font-weight="600">-0.915 ns</text><text x="500" y="578" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="578" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="578" fill="#b3261e" text-anchor="middle" font-weight="600">NO - 169 MHz</text>
    <rect x="24" y="596" width="952" height="48" fill="#ffffff"/>
    <text x="44" y="626" fill="#16243a">wb_port</text><text x="330" y="626" fill="#16243a" text-anchor="middle">+0.983 ns</text><text x="500" y="626" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="626" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="626" fill="#1a7f46" text-anchor="middle" font-weight="600">YES</text>
  </g>

  <g stroke="#d0d7de" stroke-width="1">
    <line x1="24" y1="164" x2="976" y2="164"/><line x1="24" y1="212" x2="976" y2="212"/><line x1="24" y1="260" x2="976" y2="260"/>
    <line x1="24" y1="308" x2="976" y2="308"/><line x1="24" y1="356" x2="976" y2="356"/><line x1="24" y1="404" x2="976" y2="404"/>
    <line x1="24" y1="452" x2="976" y2="452"/><line x1="24" y1="500" x2="976" y2="500"/><line x1="24" y1="548" x2="976" y2="548"/>
    <line x1="24" y1="596" x2="976" y2="596"/>
    <line x1="280" y1="72" x2="280" y2="644"/><line x1="440" y1="72" x2="440" y2="644"/><line x1="570" y1="72" x2="570" y2="644"/><line x1="720" y1="72" x2="720" y2="644"/>
  </g>
  <rect x="24" y="72" width="952" height="572" fill="none" stroke="#500000" stroke-width="2"/>
  <text x="24" y="676" font-size="18" font-weight="600" fill="#16243a">11 of 11 blocks DRC and LVS clean. 10 of 11 meet the 200 MHz spec target.</text>
  <text x="24" y="702" font-size="17" fill="#5b6b7f">scheduler also measured 168 MHz on the April RTL, so the limit is architectural, not a generation artifact.</text>
</svg>
