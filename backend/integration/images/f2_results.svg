<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 726" width="1000" height="726" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="1000" height="726" fill="#ffffff"/>
  <text x="24" y="34" font-size="25" font-weight="700" fill="#16243a">Frontend RTL at the 200 MHz spec target</text>
  <text x="24" y="58" font-size="17" fill="#5b6b7f">Frontend2 drop, 2026-09-29. Clock period 5.0 ns.</text>

  <rect x="24" y="72" width="952" height="44" fill="#500000"/>
  <text x="44"  y="101" font-size="18" font-weight="600" fill="#ffffff">Block</text>
  <text x="330" y="101" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">WNS</text>
  <text x="500" y="101" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">DRC</text>
  <text x="640" y="101" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">LVS</text>
  <text x="850" y="101" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Meets 200 MHz</text>

  <g font-size="18">
    <rect x="24" y="116" width="952" height="48" fill="#f5f7fa"/>
    <text x="44" y="146" fill="#16243a">addr_decoder</text><text x="330" y="146" fill="#5b6b7f" text-anchor="middle">no paths</text><text x="500" y="146" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="146" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="146" fill="#1a7f46" text-anchor="middle" font-weight="600">n/a</text>
    <rect x="24" y="164" width="952" height="48" fill="#ffffff"/>
    <text x="44" y="194" fill="#16243a">bank_tracker</text><text x="330" y="194" fill="#16243a" text-anchor="middle">+0.334 ns</text><text x="500" y="194" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="194" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="194" fill="#1a7f46" text-anchor="middle" font-weight="600">YES</text>
    <rect x="24" y="212" width="952" height="48" fill="#f5f7fa"/>
    <text x="44" y="242" fill="#16243a">calibration</text><text x="330" y="242" fill="#16243a" text-anchor="middle">+2.601 ns</text><text x="500" y="242" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="242" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="242" fill="#1a7f46" text-anchor="middle" font-weight="600">YES</text>
    <rect x="24" y="260" width="952" height="48" fill="#ffffff"/>
    <text x="44" y="290" fill="#16243a">cmd_gen</text><text x="330" y="290" fill="#16243a" text-anchor="middle">+2.360 ns</text><text x="500" y="290" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="290" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="290" fill="#1a7f46" text-anchor="middle" font-weight="600">YES</text>
    <rect x="24" y="308" width="952" height="48" fill="#f5f7fa"/>
    <text x="44" y="338" fill="#16243a">cmd_queue</text><text x="330" y="338" fill="#16243a" text-anchor="middle">+1.399 ns</text><text x="500" y="338" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="338" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="338" fill="#1a7f46" text-anchor="middle" font-weight="600">YES</text>
    <rect x="24" y="356" width="952" height="48" fill="#ffffff"/>
    <text x="44" y="386" fill="#16243a">config_regs</text><text x="330" y="386" fill="#16243a" text-anchor="middle">+1.317 ns</text><text x="500" y="386" fill="#1a7f46" text-anchor="middle">0</text><text x="640" y="386" fill="#1a7f46" text-anchor="middle">match</text><text x="850" y="386" fill="#1a7f46" text-anchor="middle" font-weight="600">YES</text>
    <rect x="24" y="404" width="952" height="48" fill="#f5f7fa"/>
