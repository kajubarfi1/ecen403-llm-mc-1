<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="30" y="52" font-size="38" font-weight="700" fill="#16243a">Every check proven able to fail</text>
  <text x="30" y="82" font-size="21" fill="#5b6b7f">Mutation testing: each check run on a good layout and on a deliberately broken copy</text>

  <rect x="30" y="104" width="1340" height="62" fill="#1f3a5f"/>
  <text x="55"  y="144" font-size="23" font-weight="600" fill="#ffffff">Check</text>
  <text x="830" y="144" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Good layout</text>
  <text x="1190" y="144" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Broken on purpose</text>

  <g font-size="23">
    <rect x="30" y="166" width="1340" height="76" fill="#f5f7fa"/>
    <text x="55" y="212" fill="#16243a">LVS — swap a flip-flop CLK and D</text>
    <text x="830" y="212" fill="#1a7f46" text-anchor="middle" font-weight="600">match</text>
    <text x="1190" y="212" fill="#b3261e" text-anchor="middle" font-weight="600">mismatch</text>

    <rect x="30" y="242" width="1340" height="76" fill="#ffffff"/>
    <text x="55" y="288" fill="#16243a">LVS — delete one cell</text>
    <text x="830" y="288" fill="#1a7f46" text-anchor="middle" font-weight="600">match</text>
    <text x="1190" y="288" fill="#b3261e" text-anchor="middle" font-weight="600">mismatch</text>

    <rect x="30" y="318" width="1340" height="76" fill="#f5f7fa"/>
    <text x="55" y="364" fill="#16243a">LVS — swap inputs on a black-boxed cell</text>
    <text x="830" y="364" fill="#1a7f46" text-anchor="middle" font-weight="600">match</text>
    <text x="1190" y="364" fill="#b3261e" text-anchor="middle" font-weight="600">mismatch</text>

    <rect x="30" y="394" width="1340" height="76" fill="#ffffff"/>
    <text x="55" y="440" fill="#16243a">Pin audit — pair feedthroughs wrongly</text>
    <text x="830" y="440" fill="#1a7f46" text-anchor="middle" font-weight="600">601 / 601 pins</text>
    <text x="1190" y="440" fill="#b3261e" text-anchor="middle" font-weight="600">0 accepted</text>

    <rect x="30" y="470" width="1340" height="76" fill="#f5f7fa"/>
    <text x="55" y="516" fill="#16243a">DRC — inject illegal met1 shapes</text>
    <text x="830" y="516" fill="#1a7f46" text-anchor="middle" font-weight="600">0 violations</text>
    <text x="1190" y="516" fill="#b3261e" text-anchor="middle" font-weight="600">6 violations</text>
  </g>

  <g stroke="#d0d7de" stroke-width="1">
    <line x1="30" y1="242" x2="1370" y2="242"/><line x1="30" y1="318" x2="1370" y2="318"/>
    <line x1="30" y1="394" x2="1370" y2="394"/><line x1="30" y1="470" x2="1370" y2="470"/>
    <line x1="650" y1="104" x2="650" y2="546"/><line x1="1010" y1="104" x2="1010" y2="546"/>
  </g>
  <rect x="30" y="104" width="1340" height="442" fill="none" stroke="#1f3a5f" stroke-width="2"/>
  <text x="30" y="590" font-size="21" fill="#5b6b7f">A check that cannot fail proves nothing. All 11 blocks and the full chip pass with these controls in place.</text>
</svg>
